name: bench
on:
  push:
    branches: [main]
    paths:
      - bench/**
      - .github/workflows/bench.yml
  workflow_dispatch:

jobs:
  convert:
    strategy:
      matrix:
        include:
          - file: bench.txt
            output: bench
            name: "Benchmarking (24 CPUs)"

          - file: bench-8cpu.txt
            output: bench-8cpu
            name: "Benchmarking (8 CPUs)"

          - file: bench-4cpu.txt
            output: bench-4cpu
            name: "Benchmarking (4 CPUs)"

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: goptics/vizb@v0.22.0
        with:
          bench-file: bench/${{ matrix.file }}
          name: ${{ matrix.name }}
          group-pattern: /n/y/x
          time-unit: s
          mem-unit: KB
          charts: bar
          chart: "bar:border-radius=10,stack=true"
          show-labels: true
          round: "true"
          output-json: out/${{ matrix.output }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: json-${{ matrix.output }}
          path: out/${{ matrix.output }}.json

  merge-deploy:
    needs: convert
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: json-*
          path: /tmp/jsons
          merge-multiple: true

      - uses: goptics/vizb@v0.22.0
        with:
          merge-dir: /tmp/jsons
          output-html: public/index.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          force_orphan: true
          publish_dir: public
