version: "3"

includes:
  pool:   { taskfile: pool/Taskfile.yml,   dir: pool }
  redis:  { taskfile: redis/Taskfile.yml,  dir: redis }
  sqlite: { taskfile: sqlite/Taskfile.yml, dir: sqlite }

vars:
  PUBLIC: worker/public
  DATA: worker/public/data
  DATA_URL: https://benchmarks.goptics.org/dataset
  BAR: vizb bar -p /n/y/x -T s -M MB --round -l --border-radius 8,8,0,0
  SUBJECTS: '(VarMQ|Asynq|Rmq|Taskq|GocraftWork)'
  # catalog order = dashboard order; listed literally (a glob sorts 4cpu before 24cpu)
  JSONS: >-
    worker/public/data/pool-24cpu.json worker/public/data/pool-8cpu.json worker/public/data/pool-4cpu.json
    worker/public/data/redis-persistent.json worker/public/data/redis-distributed.json
    worker/public/data/sqlite-persistent.json

tasks:
  default:
    cmds:
      - task --list

  site:json:
    desc: Convert every bench txt to dataset JSON plus the catalog
    cmds:
      - mkdir -p {{.DATA}}
      - '{{.BAR}} --stack pool/bench/pool-24cpu.txt -n "Pool (24 CPUs)" --id pool-24cpu -d "9 Go worker pools, 5 workload shapes, 1M tasks, GOMAXPROCS 24" -o {{.DATA}}/pool-24cpu.json'
      - '{{.BAR}} --stack pool/bench/pool-8cpu.txt  -n "Pool (8 CPUs)"  --id pool-8cpu  -d "Same matrix at GOMAXPROCS 8" -o {{.DATA}}/pool-8cpu.json'
      - '{{.BAR}} --stack pool/bench/pool-4cpu.txt  -n "Pool (4 CPUs)"  --id pool-4cpu  -d "Same matrix at GOMAXPROCS 4" -o {{.DATA}}/pool-4cpu.json'
      - >-
        {{.BAR}} redis/bench/redis.txt -n "Redis (Persistent)" --id redis-persistent
        -d "One consumer process: VarMQ persistent queue vs Asynq, rmq, taskq, gocraft/work; plus enqueue-only and pickup latency"
        -f '^(Benchmark)?(Durable/[^/]+C1|Enqueue/Enqueue|Latency/[^/]+)/[^/]+/{{.SUBJECTS}}$'
        --better p50-ms:low,p99-ms:low,max-ms:low
        -o {{.DATA}}/redis-persistent.json
      - >-
        {{.BAR}} redis/bench/redis.txt -n "Redis (Distributed)" --id redis-distributed
        -d "Four consumer processes: VarMQ distributed queue vs Asynq, rmq, taskq, gocraft/work"
        -f '^(Benchmark)?Durable/[^/]+C4/'
        -o {{.DATA}}/redis-distributed.json
      - >-
        {{.BAR}} sqlite/bench/sqlite.txt -n "Sqlite (Persistent)" --id sqlite-persistent
        -d "sqliteq through a VarMQ worker: one queue, drain, priority, ten queues; WAL checkpoint 1000 vs 10000 pages"
        --better walMB:low -o {{.DATA}}/sqlite-persistent.json
      - jq -se 'all(.data | length > 0)' {{.JSONS}}
      - jq -s 'map({id, name})' {{.JSONS}} > {{.DATA}}/_catalog.json

  site:html:
    desc: Build the lazy-catalog page against DATA_URL
    cmds:
      - mkdir -p {{.PUBLIC}}
      - vizb ui -c bar --data-url {{.DATA_URL}} -o {{.PUBLIC}}/index.html

  site:build:
    desc: json + html, what CI runs before wrangler deploy
    cmds:
      - task: site:json
      - task: site:html
        vars: { DATA_URL: '{{.DATA_URL}}' }

  site:preview:
    desc: Same six datasets embedded in one HTML, no Worker
    cmds:
      - task: site:json
      - mkdir -p dist
      - jq -s . {{.JSONS}} > dist/all.json
      - vizb ui -c bar dist/all.json -o dist/index.html
      - cmd: xdg-open dist/index.html
        platforms: [linux]
      - cmd: open dist/index.html
        platforms: [darwin]

  site:dev:
    desc: Build against localhost:8787 and run wrangler dev
    cmds:
      - task: site:build
        vars: { DATA_URL: http://localhost:8787/dataset }
      - cd worker && npx -y wrangler@4 dev

  site:deploy:
    desc: Production build then deploy (CI does the same)
    cmds:
      - task: site:build
      - cd worker && npx -y wrangler@4 deploy

  report:
    desc: Run every suite (hours), then open the local preview
    cmds:
      - task: redis:up
      - task: pool:txt
      - task: redis:txt
      - task: redis:down
      - task: sqlite:txt
      - task: site:preview

  clean:
    cmds:
      - rm -rf dist {{.PUBLIC}} worker/.wrangler
      - find . -name '*.prof' -o -name '*.test' | xargs rm -f
