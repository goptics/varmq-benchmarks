version: "3"

vars:
  BINARY_NAME: varmq-benchmarks
  BUILD_DIR: ./bin

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  deps:
    desc: Download and tidy dependencies
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: Build the binary
    deps: [deps]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} .

  test:
    desc: Run all tests
    deps: [deps]
    cmds:
      - go test -v ./...

  bench:
    desc: Run all benchmarks with default settings
    deps: [deps]
    cmds:
      - go test -bench=. -benchtime=2x -benchmem

  bench-quick:
    desc: Run quick benchmarks (1x iteration)
    deps: [deps]
    cmds:
      - go test -bench=. -benchtime=1x -benchmem

  bench-sleep:
    desc: Run only Sleep10ms benchmarks
    deps: [deps]
    cmds:
      - go test -bench=BenchmarkTasks/Sleep10ms -benchtime=3x -benchmem

  bench-loop:
    desc: Run only Loop10 benchmarks
    deps: [deps]
    cmds:
      - go test -bench=BenchmarkTasks/Loop10 -benchtime=3x -benchmem

  bench-mixed:
    desc: Run only Sleep5msLoop5 benchmarks
    deps: [deps]
    cmds:
      - go test -bench=BenchmarkTasks/Sleep5msLoop5 -benchtime=3x -benchmem

  bench-varmq:
    desc: Run benchmarks for VarMQ only
    deps: [deps]
    cmds:
      - go test -run xxx -bench='BenchmarkTasks/.*/.*/VarMQ$' -benchtime=3x -benchmem

  bench-pond:
    desc: Run benchmarks for Pond only
    deps: [deps]
    cmds:
      - go test -run xxx -bench='BenchmarkTasks/.*/.*/Pond$' -benchtime=3x -benchmem

  bench-profile:
    desc: Run benchmarks with CPU profiling
    deps: [deps]
    cmds:
      - go test -bench=. -benchtime=1x -cpuprofile=cpu.prof -memprofile=mem.prof

  bench-txt:
    desc: Run benchmarks and save output to bench/ directory
    deps: [deps]
    cmds:
      - mkdir -p bench
      - go test -bench=. -benchtime=2x -benchmem > bench/bench.txt
      - go test -bench=. -benchtime=2x -benchmem -cpu=4 > bench/bench-4cpu.txt
      - go test -bench=. -benchtime=2x -benchmem -cpu=8 > bench/bench-8cpu.txt


  # Vizb Visualization Tasks
  vizb:
    desc: Generate benchmark charts from bench.txt
    cmds:
      - mkdir -p jsons
      - vizb bar bench/bench.txt -p /n/y/x -T s -M KB -o jsons/bench.json -l --round 2 --stack --border-radius 10 -n "Benchmarking (24 CPUs)"

  vizb-8cpu:
    desc: Generate benchmark charts from bench-8cpu.txt
    cmds:
      - mkdir -p jsons
      - vizb bar bench/bench-8cpu.txt -p /n/y/x -T s -M KB -o jsons/bench-8cpu.json -l --round 2 --stack --border-radius 10 -n "Benchmarking (8 CPUs)"

  vizb-4cpu:
    desc: Generate benchmark charts from bench-4cpu.txt
    cmds:
      - mkdir -p jsons
      - vizb bar bench/bench-4cpu.txt -p /n/y/x -T s -M KB -o jsons/bench-4cpu.json -l --round 2 --stack --border-radius 10 -n "Benchmarking (4 CPUs)"

  vizb-all:
    desc: Generate benchmark charts for all CPU configurations
    cmds:
      - task: vizb
      - task: vizb-8cpu
      - task: vizb-4cpu

  merge:
    desc: Merge all benchmark jsons
    cmds:
      - vizb merge jsons/bench.json jsons/bench-8cpu.json jsons/bench-4cpu.json -o dist/output.json
      - vizb ui dist/output.json -o dist/index.html

  clean:
    desc: Clean build artifacts and profiles
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f *.prof
      - rm -f *.test
      - rm -rf jsons
      - rm -rf dist
      - rm -rf ./bench/*.txt

  format:
    desc: Format code
    cmds:
      - go fmt ./...

  lint:
    desc: Run linter (requires golangci-lint)
    cmds:
      - golangci-lint run

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Run all checks (format, vet, test)
    deps: [format, vet, test]

  setup:
    desc: Setup development environment
    cmds:
      - go version
      - task deps
      - echo "Development environment ready!"
