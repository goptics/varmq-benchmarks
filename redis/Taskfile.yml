version: "3"
tasks:
  up:
    desc: Redis 7.2 on localhost:6390
    cmds:
      - docker compose up -d --wait
  down:
    desc: Stop Redis
    cmds:
      - docker compose down
  test:
    desc: Module tests (needs up)
    cmds:
      - go vet ./...
      - go test ./...
  bench:
    desc: Every benchmark once (needs up)
    cmds:
      - go test -run xxx -bench . -benchtime=1x -benchmem -timeout 0
  txt:
    desc: Durable + Enqueue + Latency into bench/redis.txt, client pinned off the Redis core (needs up, hours)
    cmds:
      - mkdir -p bench
      # client on every core except 14 (Redis) and its sibling 15, like the compose cpuset
      - set -o pipefail; taskset -c 0-13,16-23 go test -run xxx -bench . -benchtime=2x -benchmem -timeout 0 | tee bench/redis.txt
